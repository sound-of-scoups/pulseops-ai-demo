services:
  - type: web
    name: pulseops-ai-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && rm -rf ../backend/static && cp -r dist ../backend/static
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
